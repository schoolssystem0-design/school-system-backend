# Defaults for every environment. Secrets come from environment variables only (docs/DEPLOYMENT-RUNBOOK.md §4).
spring:
  application:
    name: sms-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime connection: restricted LOGIN role (member of sms_app), so row-level security applies.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sms}
    username: ${DB_APP_USER:sms_app_login}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the database owner (Railway: the default postgres user).
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${PGUSER:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${PGPASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: ${APP_SESSION_IDLE_MINUTES:30}m
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  # Base URL of the Next.js app, used in emailed links (setup / password reset)
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  bootstrap:
    # First super admin (only used when none exists); remove after first sign-in
    superadmin-email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    superadmin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
    superadmin-name: ${BOOTSTRAP_SUPERADMIN_NAME:System Owner}
  files:
    local-dir: ${APP_FILES_LOCAL_DIR:}
    r2-endpoint: ${R2_ENDPOINT:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BUCKET_FILES:}
  db:
    # Runtime role created/updated after each migration (AppDatabaseRoleCallback). Leave blank to manage it manually.
    app-user: ${DB_APP_USER:sms_app_login}
    app-password: ${DB_APP_PASSWORD:}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    cookie-domain: ${APP_COOKIE_DOMAIN:}
    cookie-secure: ${APP_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  # Stable key order so the frontend's generated types only change when the API does (drift check in scripts/verify.sh).
  writer-with-order-by-keys: true

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: staging
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local
app:
  security:
    cookie-secure: false
