# Defaults for every environment. Secrets come from environment variables only (docs/DEPLOYMENT-RUNBOOK.md §4).
spring:
  application:
    name: sms-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime connection: restricted LOGIN role (member of sms_app), so row-level security applies.
    # Railway: set DATABASE_URL (reference) on this service, or PGHOST/PGPORT/PGDATABASE (not localhost).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sms}}
    username: ${DB_APP_USER:sms_app_login}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the database owner (Railway: the default postgres user).
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${PGUSER:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${PGPASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: ${APP_SESSION_IDLE_MINUTES:30}m
    jdbc:
      initialize-schema: never
  # SMTP is switched on by SPRING_MAIL_HOST (+ _PORT, _USERNAME, _PASSWORD). These defaults make 587 work out of the box
  # and stop a slow mail server from holding a request (sign-in codes) for minutes.
  mail:
    port: 587
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 15000
      "[mail.smtp.writetimeout]": 15000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  # Base URL of the Next.js app, used in emailed links (setup / password reset)
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  mail:
    # Sender address; defaults to SPRING_MAIL_USERNAME. Use the mail account's own address (or one verified with the provider).
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:School Management System}
    # Email by HTTPS API instead of SMTP (hosting that blocks SMTP ports): brevo or resend, with MAIL_API_KEY.
    provider: ${MAIL_PROVIDER:}
    api-key: ${MAIL_API_KEY:}
  bootstrap:
    # First super admin (only used when none exists); remove after first sign-in
    superadmin-email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    superadmin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
    superadmin-name: ${BOOTSTRAP_SUPERADMIN_NAME:System Owner}
    # Staging only: when true, reapplies BOOTSTRAP_SUPERADMIN_PASSWORD for the configured email (recovery)
    superadmin-reset-password: ${BOOTSTRAP_SUPERADMIN_RESET_PASSWORD:false}
  files:
    local-dir: ${APP_FILES_LOCAL_DIR:}
    r2-endpoint: ${R2_ENDPOINT:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BUCKET_FILES:}
  db:
    # Runtime role created/updated after each migration (AppDatabaseRoleCallback). Leave blank to manage it manually.
    app-user: ${DB_APP_USER:sms_app_login}
    app-password: ${DB_APP_PASSWORD:}
  # Public HTTPS address of this API (Railway: https://<service>.up.railway.app). SMS phones post delivery reports here.
  public-api-url: ${APP_PUBLIC_API_URL:http://localhost:8080}
  secrets:
    # Encrypts stored SMS phone passwords and signing keys. Any long random string; keep it stable (changing it
    # means reconnecting every school phone).
    key: ${APP_SECRETS_KEY:}
  sms-gate:
    # Offered as the server address when a school connects its phone (cloud relay of the SMS Gate app)
    default-url: ${SMSGATE_DEFAULT_URL:https://api.sms-gate.app/3rdparty/v1}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    cookie-domain: ${APP_COOKIE_DOMAIN:}
    cookie-secure: ${APP_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  # Stable key order so the frontend's generated types only change when the API does (drift check in scripts/verify.sh).
  writer-with-order-by-keys: true

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: staging
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local
app:
  security:
    cookie-secure: false
